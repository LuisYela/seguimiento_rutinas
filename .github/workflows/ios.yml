name: Compilar Flutter para iPhone

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign

      - name: Preparar archivo IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr app-unsigned.ipa Payload

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-unsigned
          path: app-unsigned.ipa